name: guardiao
description: "Guardião - Aplicativo de Proteção Individual e Dead Man's Switch para Idosos e Pessoas Vulneráveis."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & DI (ADR-005)
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  
  # Navigation
  go_router: ^14.8.1
  
  # Backend & Auth (ADR-001, ADR-003)
  supabase_flutter: ^2.8.4
  
  # Functional Programming & Value Equality
  fpdart: ^1.1.1
  equatable: ^2.0.7
  
  # Notifications (ADR-001 - Canal 1 e Canal 2)
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  
  # Device & Hardware APIs
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.3
  
  # Storage & Utilities
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  logging: ^1.3.0
  audioplayers: ^6.7.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  golden_toolkit: ^0.15.0
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
