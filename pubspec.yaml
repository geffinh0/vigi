name: guardiao
description: "Vigi: aplicativo de segurança assistiva que vigia por você. Dead man's switch para idosos e pessoas que vivem sozinhas."
publish_to: 'none'

version: 2.1.0+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & DI (ADR-005)
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  
  # Navigation
  go_router: ^14.8.1
  
  # Backend & Auth (ADR-001, ADR-003)
  supabase_flutter: ^2.8.4
  
  # Functional Programming & Value Equality
  fpdart: ^1.1.1
  equatable: ^2.0.7
  
  # Notifications (ADR-001 - Canal 1 e Canal 2)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  
  # Device & Hardware APIs
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.3
  
  # Storage & Utilities
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  logging: ^1.3.0
  audioplayers: ^6.7.1
  vibration: ^3.1.8
  home_widget: ^0.9.3
  # Notificações do navegador no painel web da família (Vigi Família)
  web: ^1.1.1
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  golden_toolkit: ^0.15.0
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/

  # As fontes vão dentro do app: funcionam sem internet desde a primeira
  # abertura. Licenças (SIL OFL 1.1) em assets/fonts/OFL-*.txt.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
