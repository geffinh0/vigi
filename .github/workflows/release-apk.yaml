name: Release APK

# Gera o APK oficial, assinado. Rode em Actions > Release APK > Run workflow,
# ou crie uma tag vX.Y.Z. Secrets necessários (Settings > Secrets > Actions):
#   VIGI_KEYSTORE_BASE64, VIGI_KEYSTORE_PASSWORD, VIGI_KEY_ALIAS, VIGI_KEY_PASSWORD
# Opcional (push FCM): GOOGLE_SERVICES_JSON_BASE64

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Conferir secrets de assinatura
        env:
          KS: ${{ secrets.VIGI_KEYSTORE_BASE64 }}
          KP: ${{ secrets.VIGI_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.VIGI_KEY_ALIAS }}
          KK: ${{ secrets.VIGI_KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do
            [ -n "${!v}" ] || { echo "::error::Secret de assinatura ausente ($v). Release oficial exige keystore."; exit 1; }
          done

      - name: Preparar keystore e Firebase
        env:
          KS: ${{ secrets.VIGI_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/vigi-release.jks"
          echo "VIGI_KEYSTORE_FILE=$RUNNER_TEMP/vigi-release.jks" >> "$GITHUB_ENV"
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; fi

      - run: flutter pub get

      - name: Testes
        run: flutter test

      - name: Build APK
        env:
          VIGI_KEYSTORE_PASSWORD: ${{ secrets.VIGI_KEYSTORE_PASSWORD }}
          VIGI_KEY_ALIAS: ${{ secrets.VIGI_KEY_ALIAS }}
          VIGI_KEY_PASSWORD: ${{ secrets.VIGI_KEY_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vigi-release
          path: build/app/outputs/flutter-apk/app-release.apk
